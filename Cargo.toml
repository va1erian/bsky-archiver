[package]
name = "bsky-archiver"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "net", "io-util", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
thiserror = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand = "0.8"
axum = { version = "0.7", features = ["form"] }
axum-extra = { version = "0.9", features = ["cookie-private", "cookie-key-expansion"] }
tower = { version = "0.4", features = ["util"] }
percent-encoding = "2.3"
askama = "0.12"
askama_axum = "0.4"
mime_guess = "2"
async_zip = { version = "0.0.18", features = ["tokio"] }
tokio-util = { version = "0.7.19", features = ["io", "compat"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
chrono = "0.4"

# NOTE: grammers-client 0.10 (Telegram MTProto support) pulls in
# grammers-crypto 0.10.0, which does not compile as published (it mixes
# num-bigint 0.4 with num-bigint 0.5 through glass_pumpkin 2.0.0-rc1). The
# checked-in Cargo.lock pins glass_pumpkin to 2.0.0-rc0 (num-bigint 0.4),
# which fixes it; `cargo update -p glass_pumpkin --precise 2.0.0-rc0`
# restores the pin if it is ever lost. Remove this note once a
# grammers-crypto release resolves the duplication.
grammers-client = "0.10"
grammers-session = "0.10"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util", "process"] }
http-body-util = "0.1"
zip = { version = "8.6.0", default-features = false }
