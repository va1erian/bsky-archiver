name: CI

# Runs on every push to main and on every pull request. Restricting the
# push trigger to main (rather than all branches) avoids a duplicate run
# on branches that also have an open PR, where the pull_request event
# already covers them.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build --release
        run: cargo build --release

      - name: cargo test
        run: cargo test

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node toolchain (for Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-browser/package-lock.json

      - name: Install Playwright suite and Chromium
        working-directory: e2e-browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser e2e suite
        run: cargo test --test browser -- --nocapture

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e-browser/test-results/
            e2e-browser/playwright-report/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bsky-archiver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - fails fast on bad Bluesky credentials
        run: |
          set +e
          output=$(timeout 60 docker run --rm \
            --name bsky-archiver-smoketest \
            -e BSKY_IDENTIFIER=invalid.example.social \
            -e BSKY_APP_PASSWORD=xxxx-xxxx-xxxx-xxxx \
            -e UI_PASSWORD=ci-smoketest-password \
            -e UI_SESSION_SECRET=ci-smoketest-session-secret-0123456789 \
            bsky-archiver:ci 2>&1)
          status=$?

          if [ "$status" -eq 124 ]; then
            echo "::error::container did not exit within 60s on invalid credentials; expected a fast fail-fast exit"
            exit 1
          fi
          echo "$output"

          if [ "$status" -eq 0 ]; then
            echo "::error::container exited 0 on invalid credentials; expected a non-zero fail-fast exit"
            exit 1
          fi

          if ! echo "$output" | grep -qi "fatal startup error"; then
            echo "::error::expected a clear 'fatal startup error' log line; none found"
            exit 1
          fi

          if echo "$output" | grep -q "xxxx-xxxx-xxxx-xxxx"; then
            echo "::error::the app password leaked into container logs"
            exit 1
          fi

          echo "container failed fast with a clear error, as expected (exit $status)"
