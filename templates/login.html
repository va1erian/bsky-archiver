<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – bsky-archiver</title>
<link rel="stylesheet" href="/static/pico.min.css">
<link rel="stylesheet" href="/static/app.css">
<script>
(function(){
  var a = localStorage.getItem('accent');
  if (a && a !== 'blue') document.documentElement.dataset.accent = a;
})();
</script>
</head>
<body>
<header class="container">
<nav class="main-nav">
<div class="accent-picker">
<label for="accent-select">Accent</label>
<select id="accent-select">
<option value="blue">Blue</option>
<option value="purple">Purple</option>
<option value="green">Green</option>
<option value="orange">Orange</option>
<option value="pink">Pink</option>
</select>
</div>
</nav>
</header>
<main class="container login-container">
<article>
<hgroup>
<h1>bsky-archiver</h1>
<h2>Sign in to view the archive</h2>
</hgroup>
{% if let Some(error) = error %}
<p role="alert" class="error-message">{{ error }}</p>
{% endif %}
<form method="post" action="/login">
<label for="password">Password
<input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
</label>
<button type="submit">Log in</button>
</form>
</article>
</main>
<script>
(function(){
  var select = document.getElementById('accent-select');
  var stored = localStorage.getItem('accent') || 'blue';
  select.value = stored;
  select.addEventListener('change', function(e){
    var val = e.target.value;
    localStorage.setItem('accent', val);
    if (val === 'blue') {
      delete document.documentElement.dataset.accent;
    } else {
      document.documentElement.dataset.accent = val;
    }
  });
})();
</script>
</body>
</html>
