{% extends "base.html" %}
{% block title %}Posts – bsky-archiver{% endblock %}
{% block content %}
<h1>Posts</h1>
<nav aria-label="Category filter">
{% for opt in category_options %}
{% if opt.selected %}
<span class="current">{{ opt.label }}</span>
{% else %}
<a href="{{ opt.href }}">{{ opt.label }}</a>
{% endif %}
{% endfor %}
</nav>
{% include "posts_list.html" %}
{% endblock %}
