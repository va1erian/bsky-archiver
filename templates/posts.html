{% extends "base.html" %}
{% block title %}Posts – bsky-archiver{% endblock %}
{% block content %}
<script>
(function () {
  // Remembers the last category/sort picked here, so a plain nav click back
  // to /posts (no query string) lands back on it instead of resetting to
  // "All / Newest archived". A URL that already carries a filter (a picked
  // link, a pagination href, a bookmark) always wins and updates the memory;
  // only a bare /posts consults it, and only once, via an immediate
  // redirect before the default-filtered list below has a chance to paint.
  var KEY = "posts-filter";
  var params = new URLSearchParams(window.location.search);
  if (params.toString()) {
    var keep = new URLSearchParams();
    if (params.get("category")) keep.set("category", params.get("category"));
    if (params.get("sort")) keep.set("sort", params.get("sort"));
    if (params.get("page_size")) keep.set("page_size", params.get("page_size"));
    var serialized = keep.toString();
    if (serialized) {
      try { localStorage.setItem(KEY, serialized); } catch (err) { /* storage unavailable */ }
    }
  } else {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (err) { /* storage unavailable */ }
    if (saved) window.location.replace("/posts?" + saved + "&page=1");
  }
})();
</script>
<h1>Posts</h1>
<nav class="category-filter" aria-label="Category filter">
{% for opt in category_options %}
{% if opt.selected %}
<span class="current">{{ opt.label }}</span>
{% else %}
<a href="{{ opt.href }}">{{ opt.label }}</a>
{% endif %}
{% endfor %}
<span class="gallery-sort">
<label for="posts-sort">Sort</label>
<select id="posts-sort">
{% for opt in sort_options %}
<option value="{{ opt.href }}" {% if opt.selected %}selected{% endif %}>{{ opt.label }}</option>
{% endfor %}
</select>
</span>
</nav>
{% include "posts_list.html" %}

<script>
(function () {
  var select = document.getElementById("posts-sort");
  if (select) {
    select.addEventListener("change", function () {
      if (select.value) window.location.href = select.value;
    });
  }

  // The page-jump dialogs live inside the list fragments htmx swaps in
  // place, so the opener listens on the document (delegated) and is bound
  // once per tab: hx-boost re-executes this block on every boosted
  // navigation, and showModal on an already-open dialog would throw.
  if (window.__pageJumpBound) return;
  window.__pageJumpBound = true;
  document.addEventListener("click", function (event) {
    var button = event.target.closest("[data-page-jump]");
    if (!button) return;
    var pagination = button.closest(".pagination");
    var dialog = pagination && pagination.querySelector("dialog.page-jump-dialog");
    if (!dialog || typeof dialog.showModal !== "function") return;
    event.preventDefault();
    dialog.showModal();
    var input = dialog.querySelector("input[type=number]");
    if (input) {
      input.focus();
      input.select();
    }
  });
})();
</script>
{% endblock %}
