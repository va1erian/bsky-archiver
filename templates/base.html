<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}bsky-archiver{% endblock %}</title>
<link rel="stylesheet" href="/static/pico.min.css">
<link rel="stylesheet" href="/static/app.css">
<script>
(function(){
  var a = localStorage.getItem('accent');
  if (a && a !== 'blue') document.documentElement.dataset.accent = a;
})();
</script>
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="container">
<nav class="main-nav">
<ul>
<li><strong><a href="/">bsky-archiver</a></strong></li>
</ul>
<div class="accent-picker">
<label for="accent-select">Accent</label>
<select id="accent-select">
<option value="blue">Blue</option>
<option value="purple">Purple</option>
<option value="green">Green</option>
<option value="orange">Orange</option>
<option value="pink">Pink</option>
</select>
</div>
<details class="nav-menu">
<summary aria-label="Menu">Menu</summary>
<ul>
<li><a href="/">Dashboard</a></li>
<li><a href="/posts">Posts</a></li>
<li><a href="/gallery">Gallery</a></li>
<li><a href="/config">Config</a></li>
<li>
<form method="post" action="/logout">
<button type="submit" class="secondary outline">Logout</button>
</form>
</li>
</ul>
</details>
</nav>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
<script>
(function(){
  var select = document.getElementById('accent-select');
  var stored = localStorage.getItem('accent') || 'blue';
  select.value = stored;
  select.addEventListener('change', function(e){
    var val = e.target.value;
    localStorage.setItem('accent', val);
    if (val === 'blue') {
      delete document.documentElement.dataset.accent;
    } else {
      document.documentElement.dataset.accent = val;
    }
  });
})();
</script>
</body>
</html>
