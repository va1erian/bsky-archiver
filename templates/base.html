<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}bsky-archiver{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/pico.min.css">
<link rel="stylesheet" href="/static/app.css">
<script>
(function(){
  var a = localStorage.getItem('accent');
  if (a && a !== 'blue') document.documentElement.dataset.accent = a;
})();
</script>
<script src="/static/htmx.min.js" defer></script>
</head>
<body hx-boost="true">
<header class="container">
<nav class="main-nav">
<ul>
<li><strong><a href="/">bsky-archiver</a></strong></li>
</ul>
<div class="accent-picker">
<label for="accent-select">Accent</label>
<select id="accent-select">
<option value="blue">Blue</option>
<option value="purple">Purple</option>
<option value="green">Green</option>
<option value="orange">Orange</option>
<option value="pink">Pink</option>
</select>
</div>
<details class="nav-menu">
<summary aria-label="Menu">Menu</summary>
<ul>
<li><a href="/">Dashboard</a></li>
<li><a href="/posts">Posts</a></li>
<li><a href="/gallery">Gallery</a></li>
<li><a href="/browser">Browser</a></li>
<li><a href="/config">Config</a></li>
<li>
<form method="post" action="/logout" hx-boost="false">
<button type="submit" class="secondary outline">Logout</button>
</form>
</li>
</ul>
</details>
</nav>
</header>
<main class="container" hx-history-elt>
{% block content %}{% endblock %}
</main>
<footer class="app-footer container">
<p>bsky-archiver v{{ version }} Â· rev {{ git_revision }} Â· built {{ build_date }}</p>
</footer>
<script>
(function(){
  var select = document.getElementById('accent-select');
  var stored = localStorage.getItem('accent') || 'blue';
  select.value = stored;
  select.addEventListener('change', function(e){
    var val = e.target.value;
    localStorage.setItem('accent', val);
    if (val === 'blue') {
      delete document.documentElement.dataset.accent;
    } else {
      document.documentElement.dataset.accent = val;
    }
  });
})();
</script>
<dialog id="lightbox" aria-modal="true">
<article>
<button aria-label="Close" id="lightbox-close" class="close-lightbox">&times;</button>
<div class="lightbox-actions">
<button class="lightbox-action" id="lightbox-like" aria-label="Like" title="Like" aria-pressed="false" hidden>
<svg class="icon-action" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="19" height="19"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.49-2.74-2-4-2a5.5 5.5 0 0 0-6.5 5.5c0 2.29 1.51 4.04 3 5.5l6.99 7Z"/></svg>
<svg class="icon-done" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="19" height="19"><path d="M20 6 9 17l-5-5"/></svg>
</button>
<button class="lightbox-action" id="lightbox-bookmark" aria-label="Bookmark" title="Bookmark" aria-pressed="false" hidden>
<svg class="icon-action" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="19" height="19"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
<svg class="icon-done" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="19" height="19"><path d="M20 6 9 17l-5-5"/></svg>
</button>
</div>
<button aria-label="Previous" class="lightbox-nav" data-nav="prev" id="lightbox-prev">&#10094;</button>
<button aria-label="Next" class="lightbox-nav" data-nav="next" id="lightbox-next">&#10095;</button>
<span id="lightbox-counter" class="lightbox-counter" aria-live="polite"></span>
<div id="lightbox-content"></div>
</article>
</dialog>

<script>
(function () {
  var dialog = document.getElementById("lightbox");
  var content = document.getElementById("lightbox-content");
  var counter = document.getElementById("lightbox-counter");
  var prevBtn = document.getElementById("lightbox-prev");
  var nextBtn = document.getElementById("lightbox-next");
  if (!dialog || !content || typeof dialog.showModal !== "function") return;

  // Media links of the current page, re-collected on every open (and again
  // after a lightbox-triggered page load) so pages swapped in by htmx
  // (gallery/post-list pagination) are included.
  var items = [];
  var index = -1;
  var loadingPage = false;
  var pageSwapped = false;
  var loadSeq = 0;
  var pendingSlide = null;

  function prefersReducedMotion() {
    return window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  // The adjacent-page pagination links of the list/grid under the lightbox
  // (gallery or posts). Absent on the first/last page and on pages with no
  // pagination (post detail), which is how boundary moves are detected.
  function pageNavLink(rel) {
    return document.querySelector('.pagination a[rel="' + rel + '"]');
  }

  function updateButtons() {
    prevBtn.disabled = loadingPage || (index <= 0 && !pageNavLink("prev"));
    nextBtn.disabled =
      loadingPage || (index >= items.length - 1 && !pageNavLink("next"));
  }

  function teardownMedia(el) {
    if (!el) return;
    // Fully detach a playing video: a <dialog> that merely closes keeps the
    // <video> alive (audio especially), so the src is dropped and load()ed
    // away to stop playback and its network fetch.
    if (el.tagName === "VIDEO") {
      el.pause();
      el.removeAttribute("src");
      el.load();
    }
    el.remove();
  }

  function stopPlayback() {
    finishPendingSlide();
    Array.prototype.slice.call(content.children).forEach(teardownMedia);
    content.innerHTML = "";
  }

  // Warm the browser cache for the neighbours of the current image so a
  // swipe or arrow press finds the next media already fetched.
  function preloadNeighbours() {
    [index - 1, index + 1].forEach(function (i) {
      var link = items[i];
      if (!link || link.getAttribute("data-media-type") === "video") return;
      var img = new Image();
      img.src = link.href;
    });
  }

  // Finishes any in-flight slide synchronously: both elements jump to their
  // end state, the outgoing one is torn down, so a fast swipe never leaves
  // two half-transitioned layers on screen.
  function finishPendingSlide() {
    if (!pendingSlide) return;
    var entry = pendingSlide;
    pendingSlide = null;
    if (!entry.settled) {
      entry.settled = true;
      entry.anims.forEach(function (anim) {
        try { anim.finish(); } catch (err) { /* already finished */ }
      });
      teardownMedia(entry.oldEl);
      entry.newEl.style.transform = "";
    }
  }

  function beginSlide(entry, direction, distance) {
    var duration = 220;
    var easing = "cubic-bezier(0.22, 0.61, 0.36, 1)";
    try {
      var oldAnim = entry.oldEl.animate(
        [{ transform: "translateX(0)" },
         { transform: "translateX(" + -distance + "%)" }],
        { duration: duration, easing: easing }
      );
      var newAnim = entry.newEl.animate(
        [{ transform: "translateX(" + distance + "%)" },
         { transform: "translateX(0)" }],
        { duration: duration, easing: easing }
      );
      entry.anims = [oldAnim, newAnim];
      Promise.all([oldAnim.finished, newAnim.finished]).then(function () {
        finishPendingSlide();
      }, function () {
        /* cancelled or finished via finishPendingSlide */
      });
    } catch (err) {
      // No Web Animations support: fall back to an instant swap.
      finishPendingSlide();
    }
  }

  // Slides the outgoing and incoming media together, full-width, like a
  // native photo carousel. direction is 1 (next, from the right) or -1
  // (prev, from the left).
  function slideBetween(oldEl, newEl, direction) {
    finishPendingSlide();
    if (oldEl.tagName === "VIDEO") oldEl.pause();
    content.appendChild(newEl);
    var distance = direction > 0 ? 100 : -100;
    newEl.style.transform = "translateX(" + distance + "%)";
    var entry = { oldEl: oldEl, newEl: newEl, anims: [], settled: false, started: false };
    pendingSlide = entry;

    // Wait (briefly) for the incoming image to be fully decoded so the
    // slide never reveals a half-painted image; the cap keeps a slow or
    // failed decode from freezing the transition. Both paths can fire,
    // so `started` keeps the slide from being kicked off twice.
    function start() {
      if (entry.started || entry.settled || pendingSlide !== entry) return;
      entry.started = true;
      beginSlide(entry, direction, distance);
    }
    if (newEl.tagName === "IMG" && newEl.decode) {
      newEl.decode().then(start, start);
      setTimeout(start, 300);
    } else {
      start();
    }
  }

  // direction: 0 = initial open (no slide), 1 = next, -1 = prev.
  function render(direction) {
    var link = items[index];
    if (!link) return;
    var isVideo = link.getAttribute("data-media-type") === "video";
    var alt = link.getAttribute("data-alt") || "";
    counter.textContent =
      items.length > 1 ? (index + 1) + " / " + items.length : "";
    updateButtons();
    updateActionButtons();
    preloadNeighbours();

    var newEl = document.createElement(isVideo ? "video" : "img");
    if (isVideo) {
      newEl.src = link.href;
      newEl.controls = true;
      newEl.autoplay = true;
      newEl.playsInline = true;
    } else {
      newEl.src = link.href;
      newEl.alt = alt;
    }

    var oldEl = content.firstElementChild;
    if (!oldEl || direction === 0 || prefersReducedMotion()) {
      finishPendingSlide();
      teardownMedia(oldEl);
      content.appendChild(newEl);
      return;
    }
    slideBetween(oldEl, newEl, direction);
  }

  // A <dialog> that merely closes stays in the DOM: a playing <video>
  // inside it keeps going (audio especially). Tear the media element down
  // so playback and its network fetch actually stop.
  dialog.addEventListener("close", stopPlayback);

  // A swap (gallery pagination, â€¦) replaces the page under an open
  // lightbox; close it rather than leave media playing over new content â€”
  // unless the swap *is* the lightbox loading an adjacent page, in which
  // case the loadAdjacentPage continuation takes over. htmx fires
  // after:swap before its ajax promise settles, so this flag doubles as
  // the "the swap really happened" check for loadAdjacentPage.
  document.body.addEventListener("htmx:after:swap", function () {
    if (loadingPage) {
      pageSwapped = true;
      return;
    }
    if (dialog.open) dialog.close();
  });

  function collectItems() {
    items = Array.prototype.slice.call(document.querySelectorAll("[data-lightbox]"));
  }

  function show(link) {
    collectItems();
    index = items.indexOf(link);
    if (index < 0) return;
    loadingPage = false;
    loadSeq++; // any in-flight page load from a previous viewing is stale
    render(0);
    dialog.showModal();
  }

  // -------------------------------------------------------------------
  // Like / bookmark actions. Only the browser grid's links carry
  // data-post-uri/data-post-cid (archive posts are the archiver's local
  // index, nothing to write back to), so the buttons stay hidden on every
  // other page. Each post's outcome is remembered for the tab's lifetime
  // so revisiting media shows the done state without a server round trip.
  var likeBtn = document.getElementById("lightbox-like");
  var bookmarkBtn = document.getElementById("lightbox-bookmark");
  var actedOn = {};

  function postAction(endpoint, link, button, doneLabel) {
    // An in-flight request guards itself: a second click is a no-op until
    // the response (or a failure) restores the button.
    if (button.disabled) return;
    button.disabled = true;
    fetch("/browser/" + endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        uri: link.getAttribute("data-post-uri"),
        cid: link.getAttribute("data-post-cid"),
      }),
    })
      .then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (body) {
          if (!response.ok || !body.ok) {
            throw new Error((body && body.message) || "request failed (" + response.status + ")");
          }
        });
      })
      .then(function () {
        var uri = link.getAttribute("data-post-uri");
        actedOn[uri] = actedOn[uri] || {};
        actedOn[uri][endpoint] = true;
        markDone(button, doneLabel);
      })
      .catch(function (err) {
        // Brief inline feedback beats vanishing silently; the button stays
        // armed so the same click can simply be retried.
        var message = document.createElement("span");
        message.className = "lightbox-action-error";
        message.setAttribute("role", "alert");
        message.textContent = err && err.message ? err.message : "failed";
        button.parentElement.appendChild(message);
        setTimeout(function () { message.remove(); }, 4000);
      })
      .then(function () {
        button.disabled = false;
      });
  }

  // Marks a button permanently acted: aria-pressed flips, the Lucide check
  // glyph replaces the icon glyph, and the label reflects the new state.
  function markDone(button, label) {
    button.classList.add("done");
    button.setAttribute("aria-pressed", "true");
    button.setAttribute("aria-label", label);
    button.title = label;
  }

  function updateActionButtons() {
    var link = items[index];
    var uri = link ? link.getAttribute("data-post-uri") : null;
    var cid = link ? link.getAttribute("data-post-cid") : null;
    var actionable = !!(uri && cid);
    [[likeBtn, "like", "Liked"], [bookmarkBtn, "bookmark", "Bookmarked"]].forEach(
      function (entry) {
        var button = entry[0];
        button.hidden = !actionable;
        button.disabled = false;
        button.classList.remove("done");
        button.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-label", entry[1] === "like" ? "Like" : "Bookmark");
        button.title = entry[1];
        if (actionable && actedOn[uri] && actedOn[uri][entry[1]]) {
          markDone(button, entry[2]);
        }
      }
    );
  }

  likeBtn.addEventListener("click", function () {
    if (likeBtn.classList.contains("done")) return;
    postAction("like", items[index], likeBtn, "Liked");
  });
  bookmarkBtn.addEventListener("click", function () {
    if (bookmarkBtn.classList.contains("done")) return;
    postAction("bookmark", items[index], bookmarkBtn, "Bookmarked");
  });

  // Loads the adjacent gallery/posts page through htmx (same fragment swap
  // the pagination links perform), then lands on its first (or last) item â€”
  // so next past the last image of a page continues into the next page,
  // and prev before the first image walks back into the previous one.
  function loadAdjacentPage(rel, pickFromEnd, direction) {
    if (typeof htmx === "undefined" || loadingPage) return;
    var link = pageNavLink(rel);
    if (!link) return;
    var href = link.getAttribute("href");
    var seq = ++loadSeq;
    loadingPage = true;
    pageSwapped = false;
    updateButtons();
    htmx
      .ajax("GET", href, {
        target: link.getAttribute("hx-target"),
        swap: link.getAttribute("hx-swap") || "outerHTML",
        // Hand the URL to htmx's own history handling (as hx-push-url does
        // on a regular pagination click): the entry is pushed with htmx's
        // {htmx: true} state marker, so back AND forward through
        // lightbox-driven pages re-render the swapped page.
        push: "true",
      })
      .then(
        function () {
          if (seq !== loadSeq) return; // superseded
          // htmx resolves without swapping on an HTTP error status;
          // only a real swap advances the lightbox.
          loadingPage = false;
          if (!pageSwapped) {
            updateButtons();
            return;
          }
          window.scrollTo(0, 0);
          collectItems();
          index = pickFromEnd ? items.length - 1 : 0;
          if (dialog.open) render(direction);
        },
        function () {
          if (seq !== loadSeq) return; // superseded
          loadingPage = false;
          updateButtons();
        }
      );
  }

  function goNext() {
    if (loadingPage) return;
    if (index < items.length - 1) {
      index++;
      render(1);
      return;
    }
    loadAdjacentPage("next", false, 1);
  }

  function goPrev() {
    if (loadingPage) return;
    if (index > 0) {
      index--;
      render(-1);
      return;
    }
    loadAdjacentPage("prev", true, -1);
  }

  document.addEventListener("click", function (event) {
    var link = event.target.closest("[data-lightbox]");
    if (!link) return;
    event.preventDefault();
    show(link);
  });

  prevBtn.addEventListener("click", goPrev);
  nextBtn.addEventListener("click", goNext);

  document.getElementById("lightbox-close").addEventListener("click", function () {
    dialog.close();
  });
  dialog.addEventListener("click", function (event) {
    if (event.target === dialog) dialog.close();
  });

  // Touch gestures: a small state machine decides, on the first ~12px of
  // dominant-axis movement, whether the gesture is a horizontal swipe
  // (navigate to the neighbouring image/page) or a vertical upward drag
  // (drag-to-close, media following the finger). One mode is committed and
  // the other is never fallen through to. Touches starting on a button
  // never gesture; touches starting in a video's native control bar
  // (bottom ~96px of its box — UA shadow DOM, so detected geometrically)
  // neither, so scrubbing/seeking stays possible; swiping on the video
  // itself works. A second finger invalidates the gesture.
  var touchStart = null;

  function touchOnVideoControls(event, touch) {
    var video = event.target.closest("video");
    if (!video) return false;
    var rect = video.getBoundingClientRect();
    return (
      touch.clientY >= rect.bottom - Math.min(96, rect.height) &&
      touch.clientY <= rect.bottom
    );
  }

  // Release below the dismiss threshold (or gesture cancelled): spring the
  // media back to identity quickly and clear the inline styles afterwards.
  function springBackMedia(el) {
    if (!el) return;
    var clear = function () {
      el.style.transform = "";
      el.style.opacity = "";
    };
    if (prefersReducedMotion()) {
      clear();
      return;
    }
    try {
      var anim = el.animate(
        [
          {
            transform: el.style.transform || "translateY(0)",
            opacity: el.style.opacity || "1",
          },
          { transform: "translateY(0)", opacity: "1" },
        ],
        { duration: 140, easing: "ease-out" }
      );
      anim.addEventListener("finish", clear);
      anim.addEventListener("cancel", clear);
    } catch (err) {
      clear();
    }
  }

  // Release beyond the threshold (distance or flick velocity): fly the media
  // up and out, then close — the dialog's close handler (stopPlayback) tears
  // the media down, which also clears every inline transform left over.
  function dismissViaDrag(el) {
    function closeNow() {
      if (el && el.isConnected) teardownMedia(el);
      // The dialog may already have been closed out from under the gesture
      // (an unrelated htmx swap); closing a closed dialog throws.
      if (dialog.open) dialog.close();
    }
    if (!el || prefersReducedMotion()) {
      closeNow();
      return;
    }
    try {
      var anim = el.animate(
        [
          {
            transform: el.style.transform || "translateY(0)",
            opacity: el.style.opacity || "1",
          },
          {
            transform: "translateY(-" + Math.round(window.innerHeight * 1.1) + "px)",
            opacity: "0",
          },
        ],
        { duration: 180, easing: "ease-out" }
      );
      anim.addEventListener("finish", closeNow);
      anim.addEventListener("cancel", closeNow);
    } catch (err) {
      closeNow();
    }
  }

  function cancelTouchGesture() {
    if (!touchStart) return;
    var el = touchStart.el;
    touchStart = null;
    springBackMedia(el);
  }

  dialog.addEventListener("touchstart", function (event) {
    if (event.touches.length !== 1 || event.target.closest("button")) {
      touchStart = null;
      return;
    }
    var touch = event.touches[0];
    touchStart = {
      x: touch.clientX,
      y: touch.clientY,
      mode: null, // undecided until ~12px of dominant-axis movement
      controls: touchOnVideoControls(event, touch),
      el: null,
      velocity: 0,
      lastY: touch.clientY,
      lastT: event.timeStamp,
    };
  }, { passive: true });

  // Non-passive so the drag-close path can preventDefault (stopping page
  // overscroll/bounce while the media follows the finger); the horizontal
  // swipe path never calls preventDefault.
  dialog.addEventListener("touchmove", function (event) {
    if (!touchStart) return;
    if (event.touches.length !== 1) {
      cancelTouchGesture();
      return;
    }
    var touch = event.touches[0];
    var dx = touch.clientX - touchStart.x;
    var dy = touch.clientY - touchStart.y;
    if (!touchStart.mode) {
      if (touchStart.controls) {
        // Started in the video control bar: scrubbing, never a gesture.
        return;
      }
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {
        touchStart.mode = "h";
      } else if (dy < 0 && -dy > 12 && -dy > Math.abs(dx)) {
        touchStart.mode = "v";
        // Co-exist with an in-flight slide: snap it to its end state first
        // so the drag grabs the settled current media.
        finishPendingSlide();
        touchStart.el = content.firstElementChild;
      }
    }
    if (touchStart.mode !== "v" || !touchStart.el) return;
    event.preventDefault();
    var dragged = -dy;
    touchStart.el.style.transform = "translateY(" + -dragged + "px)";
    touchStart.el.style.opacity = String(
      Math.max(0, 1 - dragged / (window.innerHeight * 0.25))
    );
    var dt = event.timeStamp - touchStart.lastT;
    if (dt > 0) {
      var v = ((touchStart.lastY - touch.clientY) / dt) * 1000;
      touchStart.velocity = touchStart.velocity
        ? touchStart.velocity * 0.5 + v * 0.5
        : v;
    }
    touchStart.lastY = touch.clientY;
    touchStart.lastT = event.timeStamp;
  }, { passive: false });

  dialog.addEventListener("touchcancel", function () {
    cancelTouchGesture();
  }, { passive: true });

  dialog.addEventListener("touchend", function (event) {
    if (!touchStart) return;
    var state = touchStart;
    touchStart = null;
    var touch = event.changedTouches[0];
    var dx = touch.clientX - state.x;
    var dy = touch.clientY - state.y;
    if (state.mode === "v") {
      event.preventDefault(); // no synthetic click after a drag
      if (-dy > window.innerHeight * 0.22 || state.velocity > 800) {
        dismissViaDrag(state.el);
      } else {
        springBackMedia(state.el);
      }
      return;
    }
    if (state.mode !== "h") return;
    if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
    if (dx < 0) goNext(); else goPrev();
  }, { passive: false });

  document.addEventListener("keydown", function (event) {
    if (!dialog.open) return;
    if (event.key === "ArrowRight") {
      event.preventDefault();
      goNext();
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      goPrev();
    }
  });
})();
</script>
</body>
</html>
